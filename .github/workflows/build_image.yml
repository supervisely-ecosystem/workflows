name: Build and Push Docker Image
run-name: Docker Image for ${{ github.repository }}
on:
  workflow_call:
    inputs:
      tag_version:
        description: 'Docker Image Tag (without "v")'
        required: true
        type: string
        default: ""
      dockerfile_path:
        description: "Path to Dockerfile"
        required: true
        type: string
        default: "docker/Dockerfile"
      image_name:
        description: "Docker Image Name (optional)"
        required: false
        type: string
        default: ""
      sdk_version:
        description: "Supervisely SDK version (if not specified, will be taken from LABEL in Dockerfile; if not found — error)"
        required: false
        type: string
        default: ""
      latest_tag:
        description: 'Also tag image as "latest"'
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: gha-runner-supervisely-ecosystem
    # Inputs reach the scripts through the environment instead of being
    # interpolated into the script text (no shell injection via inputs).
    env:
      IN_TAG_VERSION: ${{ inputs.tag_version }}
      IN_DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
      IN_IMAGE_NAME: ${{ inputs.image_name }}
      IN_SDK_VERSION: ${{ inputs.sdk_version }}
      IN_LATEST_TAG: ${{ inputs.latest_tag }}
    steps:
      - name: Info
        run: |
          IMAGE_NAME="$IN_IMAGE_NAME"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME=${GITHUB_REPOSITORY#*/}
          fi
          if [[ "$IMAGE_NAME" != supervisely/* ]]; then
            IMAGE_NAME="supervisely/$IMAGE_NAME"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Image name: $IMAGE_NAME"
          echo "Tag version: $IN_TAG_VERSION"
          echo "Dockerfile path: $IN_DOCKERFILE_PATH"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: supervisely-ecosystem/workflows
          path: workflow
          persist-credentials: false

      - name: Delete .git folder
        run: |
          rm -rf .git

      - name: Set tags
        id: tags
        run: |
          TAGS="${IMAGE_NAME}:${IN_TAG_VERSION}"
          if [[ "$IN_LATEST_TAG" == "true" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Get SDK version
        run: |
          if [ -n "$IN_SDK_VERSION" ]; then
            sed -i.bak -E '/LABEL (python_sdk_version|python-sdk-version|supervisely-sdk-version|supervisely_sdk_version)=/d' "$IN_DOCKERFILE_PATH"
            # leading newline: a Dockerfile without a trailing newline would otherwise
            # get the LABEL glued onto its last instruction
            printf '\nLABEL supervisely-sdk-version=%s\n' "$IN_SDK_VERSION" >> "$IN_DOCKERFILE_PATH"
            echo "Supervisely SDK version: $IN_SDK_VERSION"
          else
            SDK_VERSION=$(grep -E '^LABEL +(python_sdk_version|python-sdk-version|supervisely-sdk-version|supervisely_sdk_version)=' "$IN_DOCKERFILE_PATH" | awk -F= '{print $2}' | tr -d '\"')
            if [ -z "$SDK_VERSION" ]; then
              echo "[ERROR] Python SDK version LABEL not found in Dockerfile! You should specify the SDK version as LABEL in Dockerfile or input parameter." >&2
              exit 1
            fi
            echo "Supervisely SDK version: $SDK_VERSION"
          fi

      - name: Build Docker Image ${{ env.IMAGE_NAME }}:${{ inputs.tag_version }}
        run: |
          buildctl build \
            --frontend dockerfile.v0 \
            --local "context=${GITHUB_WORKSPACE}" \
            --local "dockerfile=$(dirname "$IN_DOCKERFILE_PATH")" \
            --opt "filename=$(basename "$IN_DOCKERFILE_PATH")" \
            --output "type=image,name=docker.io/${IMAGE_NAME}:${IN_TAG_VERSION},push=true" \
            --export-cache "type=registry,ref=docker.io/${IMAGE_NAME}:buildcache,mode=max" \
            --import-cache "type=registry,ref=docker.io/${IMAGE_NAME}:buildcache"

      - name: Build Docker Image ${{ env.IMAGE_NAME }}:latest
        if: inputs.latest_tag
        run: |
          buildctl build \
            --frontend dockerfile.v0 \
            --local "context=${GITHUB_WORKSPACE}" \
            --local "dockerfile=$(dirname "$IN_DOCKERFILE_PATH")" \
            --opt "filename=$(basename "$IN_DOCKERFILE_PATH")" \
            --output "type=image,name=docker.io/${IMAGE_NAME}:latest,push=true" \
            --import-cache "type=registry,ref=docker.io/${IMAGE_NAME}:buildcache"
