name: Build App Image From Template
run-name: Build App Image for ${{ github.repository }}

on:
  workflow_call:
    inputs:
      tag_version:
        description: "Docker Image Tag (without 'v')"
        required: false
        type: string
        default: ""
      tag_ref_name:
        description: "Value for Dockerfile build ARG tag_ref_name (optional; defaults to resolved tag_version)"
        required: false
        type: string
        default: ""
      workflows_ref:
        description: "Ref of supervisely-ecosystem/workflows to checkout for helper scripts"
        required: false
        type: string
        default: "master"
      dockerfile_template_path:
        description: "Path to Dockerfile template in caller repo (fallback: workflow default template)"
        required: false
        type: string
        default: "docker/hardened/Dockerfile.tmpl"
      docker_target:
        description: "Optional Dockerfile target stage to build"
        required: false
        type: string
        default: ""
      image_name:
        description: "Docker Image Name (optional)"
        required: false
        type: string
        default: ""
      requirements_file:
        description: "Requirements file path in caller repo"
        required: false
        type: string
        default: "dev_requirements.txt"
      config_file:
        description: "Config file path in caller repo (optional, default is config.json)"
        required: false
        type: string
        default: "config.json"
      runtime_base_image:
        description: "Base image to use in Dockerfile template ARG RUNTIME_BASE_IMAGE (optional, default is set in template)"
        required: false
        type: string
        default: ""
      extra_builder_libs:
        description: "Extra libs to install in build stage, space-separated (optional)"
        required: false
        type: string
        default: ""
      skip_tag_check:
        description: "Skip Docker Hub tag existence check"
        required: false
        type: boolean
        default: false
      latest_tag:
        required: false
        type: boolean
        default: false
      cve_checks:
        description: "Run CVE checks before pushing image"
        required: false
        type: boolean
        default: false
      no_cache_requirements:
        description: "Disable cache for requirements install step (useful for git branch dependencies)"
        required: false
        type: boolean
        default: false
      build_cache:
        description: "Import/export Docker registry build cache"
        required: false
        type: boolean
        default: true
    secrets:
      HF_TOKEN:
        description: "Hugging Face token provided to Docker builds as BuildKit secret id=hf_token"
        required: false
      DOCKERHUB_USERNAME:
        description: "Docker Hub user for pushing the scanned image (cve_checks); optional, runner credentials are used otherwise"
        required: false
      DOCKERHUB_TOKEN:
        description: "Docker Hub token for DOCKERHUB_USERNAME"
        required: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: gha-runner-supervisely-ecosystem
    # Inputs reach the scripts through the environment instead of being
    # interpolated into the script text (no shell injection via inputs).
    env:
      IN_IMAGE_NAME: ${{ inputs.image_name }}
      IN_TAG_VERSION: ${{ inputs.tag_version }}
      IN_TAG_REF_NAME: ${{ inputs.tag_ref_name }}
      IN_DOCKERFILE_TEMPLATE_PATH: ${{ inputs.dockerfile_template_path }}
      IN_DOCKER_TARGET: ${{ inputs.docker_target }}
      IN_REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
      IN_CONFIG_FILE: ${{ inputs.config_file }}
      IN_RUNTIME_BASE_IMAGE: ${{ inputs.runtime_base_image }}
      IN_EXTRA_BUILDER_LIBS: ${{ inputs.extra_builder_libs }}
      IN_NO_CACHE_REQUIREMENTS: ${{ inputs.no_cache_requirements }}
      IN_BUILD_CACHE: ${{ inputs.build_cache }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: supervisely-ecosystem/workflows
          path: workflow
          ref: ${{ inputs.workflows_ref }}
          persist-credentials: false

      - name: Info
        run: |
          IMAGE_NAME="$IN_IMAGE_NAME"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME=${GITHUB_REPOSITORY#*/}
          fi
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ "$IMAGE_NAME" != supervisely/* ]]; then
            IMAGE_NAME="supervisely/$IMAGE_NAME"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_NAME_SAFE=${IMAGE_NAME#*/}" >> "$GITHUB_ENV"
          echo "Image name: $IMAGE_NAME"
          echo "Tag version: $IN_TAG_VERSION"
          echo "Tag ref name: $IN_TAG_REF_NAME"
          echo "Dockerfile template path: $IN_DOCKERFILE_TEMPLATE_PATH"
          echo "Docker target: $IN_DOCKER_TARGET"
          echo "Requested requirements file: $IN_REQUIREMENTS_FILE"
          echo "Runtime base image: $IN_RUNTIME_BASE_IMAGE"
          echo "No cache requirements: $IN_NO_CACHE_REQUIREMENTS"
          echo "Build cache: $IN_BUILD_CACHE"

      - name: Prepare runtime base image
        run: |
          RUNTIME_BASE_IMAGE_ARG="$IN_RUNTIME_BASE_IMAGE"
          if [ -n "$RUNTIME_BASE_IMAGE_ARG" ]; then
            echo "RUNTIME_BASE_IMAGE=$RUNTIME_BASE_IMAGE_ARG" >> "$GITHUB_ENV"
            echo "Using runtime base image override: $RUNTIME_BASE_IMAGE_ARG"
          else
            echo "No runtime base image override provided; Dockerfile template default will be used"
          fi

      - name: Prepare tag version
        id: prep
        run: |
          TAG_VERSION="$IN_TAG_VERSION"
          TAG_REF_NAME="$IN_TAG_REF_NAME"
          . "$HOME/.venv_hardened/bin/activate"
          if [ -z "$TAG_VERSION" ]; then
            TAG_VERSION=$(python3 workflow/scripts/resolve_release_tag.py \
              --config "$IN_CONFIG_FILE" \
              --requirements "$IN_REQUIREMENTS_FILE" \
              --input-release-tag "$IN_TAG_VERSION")
          fi
          if [ -z "$TAG_VERSION" ]; then
            echo "Tag version is not set. Provide inputs.tag_version or config.json .version." >&2
            exit 1
          fi

          if [ -z "$TAG_REF_NAME" ]; then
            if [ -n "$TAG_VERSION" ]; then
              # the runtime base image has no rebuild suffix: 6.74.34-1 builds on base 6.74.34
              TAG_REF_NAME=$(python3 workflow/scripts/resolve_release_tag.py \
                --config "$IN_CONFIG_FILE" \
                --requirements "$IN_REQUIREMENTS_FILE" \
                --strip-suffix \
                --input-release-tag "" || true)
            fi

            if [ -z "$TAG_REF_NAME" ]; then
              TAG_REF_NAME="$TAG_VERSION"
            fi
          fi

          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "TAG_REF_NAME=$TAG_REF_NAME" >> "$GITHUB_ENV"

      - name: Validate tag in Docker Hub
        env:
          SKIP_TAG_CHECK: ${{ inputs.skip_tag_check }}
        run: |
          if [ "$SKIP_TAG_CHECK" = "true" ]; then
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
            echo "Docker Hub tag check skipped by input"
            exit 0
          fi

          TAG_URL="https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${TAG_VERSION}"
          # Docker Hub rate-limits (429) and has transient 5xx/network errors:
          # retry those with a linear backoff (15+30+45+60 s) before giving up.
          MAX_ATTEMPTS=5
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$TAG_URL" || true)
            HTTP_CODE=${HTTP_CODE:-000}  # 000 = no HTTP answer (DNS, timeout, reset)
            case "$HTTP_CODE" in
              429|5[0-9][0-9]|000)
                if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                  DELAY=$((ATTEMPT * 15))
                  echo "Docker Hub answered HTTP ${HTTP_CODE} (attempt ${ATTEMPT}/${MAX_ATTEMPTS}); retrying in ${DELAY}s" >&2
                  sleep "$DELAY"
                  continue
                fi
                ;;
            esac
            break
          done

          if [ "$HTTP_CODE" = "200" ]; then
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
            echo "Docker image tag already exists: ${IMAGE_NAME}:${TAG_VERSION}"
            echo "All subsequent steps will be skipped"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
            echo "Tag is available: ${IMAGE_NAME}:${TAG_VERSION}"
          else
            echo "Unable to validate tag existence on Docker Hub (HTTP ${HTTP_CODE})." >&2
            exit 1
          fi

      - name: Resolve requirements file
        if: ${{ env.TAG_EXISTS != 'true' }}
        env:
          REQUESTED_REQ_FILE: ${{ inputs.requirements_file }}
        run: |
          DEFAULT_REQ_FILE="dev_requirements.txt"
          RESOLVED_REQ_FILE=""

          if [ "$REQUESTED_REQ_FILE" != "$DEFAULT_REQ_FILE" ] && [ -f "$REQUESTED_REQ_FILE" ]; then
            # an explicitly requested file (e.g. serve/dev_requirements.txt) wins
            RESOLVED_REQ_FILE="$REQUESTED_REQ_FILE"
          elif [ -f "requirements.txt" ]; then
            # legacy precedence, kept for callers that use the default input
            RESOLVED_REQ_FILE="requirements.txt"
          elif [ -f "$REQUESTED_REQ_FILE" ]; then
            RESOLVED_REQ_FILE="$REQUESTED_REQ_FILE"
          fi

          if [ -z "$RESOLVED_REQ_FILE" ]; then
            if [ "$REQUESTED_REQ_FILE" != "$DEFAULT_REQ_FILE" ]; then
              echo "Requested requirements file '$REQUESTED_REQ_FILE' not found (and no requirements.txt)." >&2
              exit 1
            fi
            # no requirements at all: build the base image with nothing added
            # instead of failing (Supervisely-Release needs this job)
            RESOLVED_REQ_FILE="sly_empty_requirements.txt"
            : > "$RESOLVED_REQ_FILE"
            echo "No requirements file found ('$REQUESTED_REQ_FILE', 'requirements.txt'); using an empty one."
          fi

          echo "REQUIREMENTS_FILE=$RESOLVED_REQ_FILE" >> "$GITHUB_ENV"
          echo "Resolved requirements file: $RESOLVED_REQ_FILE"

      - name: Delete .git folder
        if: ${{ env.TAG_EXISTS != 'true' }}
        run: |
          rm -rf .git

      - name: Prepare Dockerfile path
        if: ${{ env.TAG_EXISTS != 'true' }}
        run: |
          REQUESTED_DOCKERFILE_PATH="$IN_DOCKERFILE_TEMPLATE_PATH"
          DEFAULT_DOCKERFILE_PATH="workflow/docker/hardened/Dockerfile.tmpl"

          if [ -f "$REQUESTED_DOCKERFILE_PATH" ]; then
            DOCKERFILE_PATH="$REQUESTED_DOCKERFILE_PATH"
            echo "Using caller repo Dockerfile template: $DOCKERFILE_PATH"
          elif [ -f "$DEFAULT_DOCKERFILE_PATH" ]; then
            DOCKERFILE_PATH="$DEFAULT_DOCKERFILE_PATH"
            echo "Caller template not found at $REQUESTED_DOCKERFILE_PATH"
            echo "Falling back to default Dockerfile template: $DOCKERFILE_PATH"
          else
            echo "Dockerfile template not found in caller repo ($REQUESTED_DOCKERFILE_PATH) and default template is missing ($DEFAULT_DOCKERFILE_PATH)" >&2
            exit 1
          fi

          echo "DOCKERFILE_DIR=$(dirname "$DOCKERFILE_PATH")" >> "$GITHUB_ENV"
          echo "DOCKERFILE_NAME=$(basename "$DOCKERFILE_PATH")" >> "$GITHUB_ENV"

      - name: Prepare Docker build secrets
        if: ${{ env.TAG_EXISTS != 'true' }}
        env:
          HF_TOKEN_SECRET: ${{ secrets.HF_TOKEN }}
        run: |
          BUILD_SECRET_OPT=""
          BUILD_SECRET_DIR=""
          BUILD_SECRET_FILE=""
          if [ -n "$HF_TOKEN_SECRET" ]; then
            BUILD_SECRET_DIR="$RUNNER_TEMP/docker-build-secrets"
            mkdir -p "$BUILD_SECRET_DIR"
            BUILD_SECRET_FILE="$BUILD_SECRET_DIR/hf_token"
            printf '%s' "$HF_TOKEN_SECRET" > "$BUILD_SECRET_FILE"
            chmod 600 "$BUILD_SECRET_FILE"
            BUILD_SECRET_OPT="--secret id=hf_token,src=$BUILD_SECRET_FILE"
            echo "Hugging Face token will be provided to Docker as BuildKit secret id=hf_token"
          else
            echo "No Hugging Face token secret provided"
          fi
          {
            echo "BUILD_SECRET_OPT=$BUILD_SECRET_OPT"
            echo "BUILD_SECRET_DIR=$BUILD_SECRET_DIR"
            echo "BUILD_SECRET_FILE=$BUILD_SECRET_FILE"
          } >> "$GITHUB_ENV"

      - name: Build image archive for checks
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks }}
        run: |
          RUNTIME_BASE_IMAGE_OPT=""
          if [ -n "${RUNTIME_BASE_IMAGE:-}" ]; then
            RUNTIME_BASE_IMAGE_OPT="--opt build-arg:RUNTIME_BASE_IMAGE=${RUNTIME_BASE_IMAGE}"
          fi

          CACHEBUST_OPT=""
          if [ "$IN_NO_CACHE_REQUIREMENTS" = "true" ]; then
            CACHEBUST_OPT="--opt build-arg:CACHEBUST=$(date +%s)"
          fi

          CACHE_OPTS=()
          if [ "$IN_BUILD_CACHE" = "true" ]; then
            CACHE_OPTS+=(--export-cache "type=registry,ref=docker.io/${IMAGE_NAME}:buildcache,mode=max")
            CACHE_OPTS+=(--import-cache "type=registry,ref=docker.io/${IMAGE_NAME}:buildcache")
          fi

          DOCKER_TARGET_OPT=""
          if [ -n "$IN_DOCKER_TARGET" ]; then
            DOCKER_TARGET_OPT="--opt target=${IN_DOCKER_TARGET}"
          fi

          # shellcheck disable=SC2086 # the *_OPT variables hold zero or more flags
          buildctl build \
            --frontend dockerfile.v0 \
            --local "context=${GITHUB_WORKSPACE}" \
            --local "dockerfile=${DOCKERFILE_DIR}" \
            --opt "filename=${DOCKERFILE_NAME}" \
            ${DOCKER_TARGET_OPT} \
            --opt "build-arg:REQUIREMENTS_FILE=${REQUIREMENTS_FILE}" \
            --opt "build-arg:tag_ref_name=${TAG_REF_NAME}" \
            --opt "build-arg:EXTRA_BUILDER_LIBS=${IN_EXTRA_BUILDER_LIBS}" \
            ${RUNTIME_BASE_IMAGE_OPT} \
            ${CACHEBUST_OPT} \
            ${BUILD_SECRET_OPT} \
            --output "type=docker,name=${IMAGE_NAME}:${TAG_VERSION},dest=image.tar" \
            "${CACHE_OPTS[@]}"

      - name: pip-audit scan
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks }}
        run: |
          mkdir -p audit_logs
          syft -q "docker-archive:image.tar" -o json > audit_logs/syft-image.json
          . "$HOME/.venv_hardened/bin/activate"
          python3 workflow/scripts/get_image_packages.py \
            --syft-json audit_logs/syft-image.json \
            --output-requirements audit_logs/image_python_requirements.txt

          if [ -s audit_logs/image_python_requirements.txt ]; then
            python3 -m pip_audit \
              -r audit_logs/image_python_requirements.txt \
              --no-deps \
              --disable-pip \
              --format json > audit_logs/pip_audit.json
          else
            echo "[]" > audit_logs/pip_audit.json
          fi

      - name: Dockle scan on archive
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks }}
        run: |
          mkdir -p dockle_logs
          dockle --exit-code 1 --exit-level FATAL --input image.tar -af settings.py --format json --output "dockle_logs/${IMAGE_NAME_SAFE}.json"

      - name: Generate SBOM (SPDX JSON)
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks }}
        run: |
          mkdir -p sbom_logs
          syft -q "docker-archive:image.tar" -o "spdx-json=sbom_logs/${IMAGE_NAME_SAFE}-sbom.json"

      - name: Build and push Docker Image ${{ env.IMAGE_NAME }}:${{ env.TAG_VERSION }}
        if: ${{ env.TAG_EXISTS != 'true' && !inputs.cve_checks }}
        run: |
          RUNTIME_BASE_IMAGE_OPT=""
          if [ -n "${RUNTIME_BASE_IMAGE:-}" ]; then
            RUNTIME_BASE_IMAGE_OPT="--opt build-arg:RUNTIME_BASE_IMAGE=${RUNTIME_BASE_IMAGE}"
          fi

          CACHEBUST_OPT=""
          if [ "$IN_NO_CACHE_REQUIREMENTS" = "true" ]; then
            CACHEBUST_OPT="--opt build-arg:CACHEBUST=$(date +%s)"
          fi

          CACHE_OPTS=()
          if [ "$IN_BUILD_CACHE" = "true" ]; then
            CACHE_OPTS+=(--export-cache "type=registry,ref=docker.io/${IMAGE_NAME}:buildcache,mode=max")
            CACHE_OPTS+=(--import-cache "type=registry,ref=docker.io/${IMAGE_NAME}:buildcache")
          fi

          DOCKER_TARGET_OPT=""
          if [ -n "$IN_DOCKER_TARGET" ]; then
            DOCKER_TARGET_OPT="--opt target=${IN_DOCKER_TARGET}"
          fi

          # shellcheck disable=SC2086 # the *_OPT variables hold zero or more flags
          buildctl build \
            --frontend dockerfile.v0 \
            --local "context=${GITHUB_WORKSPACE}" \
            --local "dockerfile=${DOCKERFILE_DIR}" \
            --opt "filename=${DOCKERFILE_NAME}" \
            ${DOCKER_TARGET_OPT} \
            --opt "build-arg:REQUIREMENTS_FILE=${REQUIREMENTS_FILE}" \
            --opt "build-arg:tag_ref_name=${TAG_REF_NAME}" \
            --opt "build-arg:EXTRA_BUILDER_LIBS=${IN_EXTRA_BUILDER_LIBS}" \
            ${RUNTIME_BASE_IMAGE_OPT} \
            ${CACHEBUST_OPT} \
            ${BUILD_SECRET_OPT} \
            --output "type=image,name=docker.io/${IMAGE_NAME}:${TAG_VERSION},push=true" \
            "${CACHE_OPTS[@]}"

      - name: Build and push Docker Image ${{ env.IMAGE_NAME }}:latest
        if: ${{ env.TAG_EXISTS != 'true' && inputs.latest_tag && !inputs.cve_checks }}
        run: |
          RUNTIME_BASE_IMAGE_OPT=""
          if [ -n "${RUNTIME_BASE_IMAGE:-}" ]; then
            RUNTIME_BASE_IMAGE_OPT="--opt build-arg:RUNTIME_BASE_IMAGE=${RUNTIME_BASE_IMAGE}"
          fi

          CACHEBUST_OPT=""
          if [ "$IN_NO_CACHE_REQUIREMENTS" = "true" ]; then
            CACHEBUST_OPT="--opt build-arg:CACHEBUST=$(date +%s)"
          fi

          CACHE_OPTS=()
          if [ "$IN_BUILD_CACHE" = "true" ]; then
            CACHE_OPTS+=(--import-cache "type=registry,ref=docker.io/${IMAGE_NAME}:buildcache")
          fi

          DOCKER_TARGET_OPT=""
          if [ -n "$IN_DOCKER_TARGET" ]; then
            DOCKER_TARGET_OPT="--opt target=${IN_DOCKER_TARGET}"
          fi

          # shellcheck disable=SC2086 # the *_OPT variables hold zero or more flags
          buildctl build \
            --frontend dockerfile.v0 \
            --local "context=${GITHUB_WORKSPACE}" \
            --local "dockerfile=${DOCKERFILE_DIR}" \
            --opt "filename=${DOCKERFILE_NAME}" \
            ${DOCKER_TARGET_OPT} \
            --opt "build-arg:REQUIREMENTS_FILE=${REQUIREMENTS_FILE}" \
            --opt "build-arg:tag_ref_name=${TAG_REF_NAME}" \
            --opt "build-arg:EXTRA_BUILDER_LIBS=${IN_EXTRA_BUILDER_LIBS}" \
            ${RUNTIME_BASE_IMAGE_OPT} \
            ${CACHEBUST_OPT} \
            ${BUILD_SECRET_OPT} \
            --output "type=image,name=docker.io/${IMAGE_NAME}:latest,push=true" \
            "${CACHE_OPTS[@]}"

      - name: Push scanned image archive
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            skopeo copy \
              --dest-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              docker-archive:image.tar \
              "docker://docker.io/${IMAGE_NAME}:${TAG_VERSION}"
          else
            skopeo copy \
              docker-archive:image.tar \
              "docker://docker.io/${IMAGE_NAME}:${TAG_VERSION}"
          fi

      - name: Tag and push latest from scanned image
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks && inputs.latest_tag }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            skopeo copy \
              --src-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              --dest-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              "docker://docker.io/${IMAGE_NAME}:${TAG_VERSION}" \
              "docker://docker.io/${IMAGE_NAME}:latest"
          else
            skopeo copy \
              "docker://docker.io/${IMAGE_NAME}:${TAG_VERSION}" \
              "docker://docker.io/${IMAGE_NAME}:latest"
          fi

      - name: Cleanup Docker build secrets
        if: ${{ always() }}
        run: |
          if [ -n "${BUILD_SECRET_FILE:-}" ]; then
            rm -f "$BUILD_SECRET_FILE"
          fi
          if [ -n "${BUILD_SECRET_DIR:-}" ]; then
            rmdir "$BUILD_SECRET_DIR" 2>/dev/null || true
          fi

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks && always() }}
        with:
          name: pip-audit-${{ env.IMAGE_NAME_SAFE }}
          path: audit_logs/pip_audit.json

      - name: Upload Dockle report
        uses: actions/upload-artifact@v4
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks && always() }}
        with:
          name: dockle-${{ env.IMAGE_NAME_SAFE }}
          path: dockle_logs/${{ env.IMAGE_NAME_SAFE }}.json

      - name: Upload SBOM report
        uses: actions/upload-artifact@v4
        if: ${{ env.TAG_EXISTS != 'true' && inputs.cve_checks && always() }}
        with:
          name: sbom-${{ env.IMAGE_NAME_SAFE }}
          path: sbom_logs/${{ env.IMAGE_NAME_SAFE }}-sbom.json
